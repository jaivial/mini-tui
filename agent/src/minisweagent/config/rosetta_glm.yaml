# Z.ai GLM 5.3 Flash through the local Rosetta gateway (https://127.0.0.1:9120).
#
# Merge it on top of the default config; it only pins the model and the gateway
# connection, it does not repeat the prompts:
#
#     mini -c mini.yaml -c rosetta_glm.yaml -t "Fix the failing test in test_utils.py"
#
# which is what the `mini-glm` bash alias does with --model rosetta/zai-glm/glm-5.3-flash.
#
# `zai-glm/glm-5.3-flash` is the id Rosetta advertises on /v1/models; a bare
# `glm-5.3-flash` is rejected by the gateway, so the provider prefix must stay.
#
# The gateway fronts local/subscription backends and reports no per-token prices,
# so cost tracking stays off and no cost limit can act as a backstop: the
# step limit (or the harness timeout) is the only stop condition.
#
# ROSETTA_API_BASE / ROSETTA_API_KEY have defaults baked into the model class
# (http://127.0.0.1:9120/v1 and rosetta-local). Override them only for a route
# the loopback default cannot serve, e.g. a container that has no loopback path
# to the gateway:
#
#     ROSETTA_API_BASE=http://172.17.0.1:9121/v1 mini -c mini.yaml -c rosetta_glm.yaml ...
model:
  model_name: "zai-glm/glm-5.3-flash"
  model_kwargs: {}
agent:
  cost_limit: 3.