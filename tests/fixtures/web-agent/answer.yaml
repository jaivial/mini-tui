agent:
  max_consecutive_format_errors: 10
  system_template: "You are a helpful assistant that can interact with a computer.\n\
    \n<response_format_rule>\nEvery response MUST include at least one bash tool call\
    \ \u2014 EXCEPT your final one. A mid-task plain-text reply is a protocol violation:\
    \ it executes nothing and wastes turns.\nWhen the task is done, finish by replying\
    \ with your complete final answer as plain text and no tool call. That response\
    \ ends the run and reaches the user verbatim, so write the answer directly in\
    \ the message \u2014 never to a file.\n</response_format_rule>\n"
  instance_template: "Please solve this issue: {{task}}\n\nYou can execute bash commands\
    \ and edit files to implement the necessary changes.\n\n## Recommended Workflow\n\
    \nThis workflow should be done step-by-step so that you can iterate on your changes\
    \ and any possible problems.\n\n1. Analyze the codebase by finding and reading\
    \ relevant files\n2. Create a script to reproduce the issue\n3. Edit the source\
    \ code to resolve the issue\n4. Verify your fix works by running your script again\n\
    5. Test edge cases to ensure your fix is robust\n6. Submit your changes and finish\
    \ your work by replying with your final answer as plain text (no tool call in\
    \ that last message).\n   Put everything the user needs to know in that message.\
    \ <important>That response ends the run; nothing can follow it.</important>\n\n\
    ## Command Execution Rules\n\nYou are operating in an environment where\n\n1.\
    \ You issue at least one command\n2. The system executes the command(s) in a subshell\n\
    3. You see the result(s)\n4. You write your next command(s)\n\nEach response should\
    \ include:\n\n1. **Reasoning text** where you explain your analysis and plan\n\
    2. At least one tool call with your command\n\n**CRITICAL REQUIREMENTS:**\n\n\
    - Your response SHOULD include reasoning text explaining what you're doing\n-\
    \ Your response MUST include AT LEAST ONE bash tool call \u2014 except the final\
    \ one, which is plain text only\n- Never reply with plain text mid-task; the only\
    \ plain-text response is the final answer\n- Directory or environment variable\
    \ changes are not persistent. Every action is executed in a new subshell.\n- However,\
    \ you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir\
    \ && ...` or write/load environment variables from files\n- Submit your changes\
    \ and finish your work by replying with your final answer as plain text and no\
    \ tool call.\n  Put everything the user needs in that message. <important>That\
    \ response ends the run; nothing can follow it.</important>\n\nExample of a CORRECT\
    \ response:\n<example_response>\nI need to understand the structure of the repository\
    \ first. Let me check what files are in the current directory to get a better\
    \ understanding of the codebase.\n\n[Makes bash tool call with {\"command\": \"\
    ls -la\"} as arguments]\n</example_response>\n\nExample of a CORRECT final response\
    \ (answer delivered inside the tool call):\n<example_response>\nThe fix is verified\
    \ and all tests pass. Here is the summary, then I submit:\n\n[Makes bash tool\
    \ call with {\"command\": \"echo 'ANSWER: ...final summary...'\"} as arguments]\n\
    </example_response>\n\nExample of an INCORRECT response (protocol violation \u2014\
    \ never do this):\n<example_response>\nThe task is complete. The answer is: re-enqueued\
    \ YES, resumed at same step NO.\n(No tool call \u2014 this text-only response\
    \ is invalid and wastes a turn.)\n</example_response>\n\n<system_information>\n\
    {{system}} {{release}} {{version}} {{machine}}\n</system_information>\n\n## Useful\
    \ command examples\n\n### Create a new file:\n\n```bash\ncat <<'EOF' > newfile.py\n\
    import numpy as np\nhello = \"world\"\nprint(hello)\nEOF\n```\n\n### Edit files\
    \ with sed:\n\n{%- if system == \"Darwin\" -%}\n<important>\nYou are on MacOS.\
    \ For all the below examples, you need to use `sed -i ''` instead of `sed -i`.\n\
    </important>\n{%- endif -%}\n\n```bash\n# Replace all occurrences\nsed -i 's/old_string/new_string/g'\
    \ filename.py\n\n# Replace only first occurrence\nsed -i 's/old_string/new_string/'\
    \ filename.py\n\n# Replace first occurrence on line 1\nsed -i '1s/old_string/new_string/'\
    \ filename.py\n\n# Replace all occurrences in lines 1-10\nsed -i '1,10s/old_string/new_string/g'\
    \ filename.py\n```\n\n### View file content:\n\n```bash\n# View specific lines\
    \ with numbers\nnl -ba filename.py | sed -n '10,20p'\n```\n\n### Any other command\
    \ you want to run\n\n```bash\nanything\n```\n"
  step_limit: 0
  cost_limit: 3.0
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  model_class: minisweagent.models.test_models.DeterministicToolcallModel
  model_name: deterministic
  cost_per_call: 0.01
  outputs:
  - role: assistant
    content: Let me check.
    tool_calls:
    - id: call_1
      type: function
      function:
        name: bash
        arguments: '{"command": "echo hello-from-tool"}'
    extra:
      actions:
      - command: echo hello-from-tool
        tool_call_id: call_1
  - role: assistant
    content: The answer is 42.
    extra:
      submission: The answer is 42.
