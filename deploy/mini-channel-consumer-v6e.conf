[Service]
# v6-E: transcription runs under a systemd USER scope (transcribe.ts wraps
# whisper-cli in `systemd-run --user` so a note can never squeeze the box).
# This unit is a SYSTEM unit, and systemd does not export XDG_RUNTIME_DIR there,
# so `systemd-run --user` fails with "Failed to connect to bus: No such file or
# directory" and EVERY transcription degrades to "temporarily unavailable" —
# silently, because the failure is classified transient on purpose.
# Linger is enabled for this user, so the user manager is always reachable here.
Environment=XDG_RUNTIME_DIR=/run/user/1003