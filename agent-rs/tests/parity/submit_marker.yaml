agent:
  system_template: "s"
  instance_template: "{{task}}"
environment:
  timeout: 1
model:
  model_class: minisweagent.models.test_models.DeterministicToolcallModel
  model_name: deterministic
  outputs:
    - role: assistant
      content: "slow"
      tool_calls: [{id: t1, type: function, function: {name: bash, arguments: '{"command": "echo before; sleep 5"}'}}]
      extra: {actions: [{command: "echo before; sleep 5", tool_call_id: t1}]}
    - role: assistant
      content: "missing dir"
      tool_calls: [{id: t2, type: function, function: {name: bash, arguments: '{"command": "cat /nonexistent/file"}'}}]
      extra: {actions: [{command: "cat /nonexistent/file", tool_call_id: t2}]}
    - role: assistant
      content: "submit"
      tool_calls: [{id: t3, type: function, function: {name: bash, arguments: '{"command": "printf \"COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\\nall done\\n\""}'}}]
      extra: {actions: [{command: "printf \"COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\\nall done\\n\"", tool_call_id: t3}]}
