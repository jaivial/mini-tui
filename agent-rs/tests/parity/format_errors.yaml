# The scripted model has no parser: format errors come from the text model's observation path.
# Here: repeated tool-call format errors are driven by a toolcall model returning bad outputs is
# not possible (the script is the reply), so this scenario covers the limits instead.
agent:
  system_template: "sys {{ model_name }}"
  instance_template: "{{task}} limit={{ step_limit }}"
  step_limit: 2
model:
  model_class: minisweagent.models.test_models.DeterministicToolcallModel
  model_name: deterministic
  outputs:
    - role: assistant
      content: "one"
      tool_calls: [{id: a1, type: function, function: {name: bash, arguments: '{"command": "echo 1"}'}}]
      extra: {actions: [{command: "echo 1", tool_call_id: a1}], cost: 0.25}
    - role: assistant
      content: "two"
      tool_calls: [{id: a2, type: function, function: {name: bash, arguments: '{"command": "echo 2"}'}}]
      extra: {actions: [{command: "echo 2", tool_call_id: a2}], cost: 0.25}
    - role: assistant
      content: "never reached"
      extra: {submission: "x"}
