model:
  model_class: minisweagent.models.test_models.DeterministicToolcallModel
  model_name: deterministic
  outputs:
    - role: assistant
      content: "Let me check."
      tool_calls: [{id: call_1, type: function, function: {name: bash, arguments: '{"command": "echo hello-from-tool; printf \"%%0.s-\" $(seq 1 12000)"}'}}]
      extra: {actions: [{command: "echo hello-from-tool; printf \"%0.s-\" $(seq 1 12000)", tool_call_id: call_1}]}
    - role: assistant
      content: "The answer is 42."
      extra: {submission: "The answer is 42."}
