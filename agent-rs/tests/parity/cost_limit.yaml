agent:
  system_template: "s"
  instance_template: "{{task}}"
  cost_limit: 0.3
model:
  model_class: minisweagent.models.test_models.DeterministicToolcallModel
  model_name: deterministic
  outputs:
    - role: assistant
      content: "a"
      tool_calls: [{id: a1, type: function, function: {name: bash, arguments: '{"command": "true"}'}}]
      extra: {actions: [{command: "true", tool_call_id: a1}], cost: 0.5}
    - role: assistant
      content: "b"
      extra: {submission: "b"}
