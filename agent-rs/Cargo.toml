[package]
name = "mini-agent-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of the mini-swe-agent runner that mini-tui drives (same CLI, trajectory, journal and control file)"
license = "MIT"
publish = false

[[bin]]
name = "mini-agent-rs"
path = "src/main.rs"

[features]
task-graph = ["dep:rusqlite", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"], optional = true }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"], optional = true }
minijinja = { version = "2", features = ["preserve_order", "json", "loop_controls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }
regex = "1"
# `repl`: the sandboxed REPL harness (pure Rust: no fs/net/process unless the host registers it)
rhai = { version = "1.23", features = ["sync", "serde"] }
rquickjs = "0.9"
libc = "0.2"
rand = "0.8"
# e2e: DevTools-protocol websocket (local only, no TLS), TOTP and screenshots
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
